<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Operator: Dead Zone</title>
<style>
  /* ---- Dark theme, responsive canvas wrapper ---- */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0c;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #e6e6e6;
  }

  /* Wrapper just fills the browser window. */
  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* The "stage" is the single source of truth for the 1280x720 box.
     It's sized to the largest 16:9 rectangle that fits the window
     (via min()), then canvas/hud/overlay below are all absolutely
     positioned to fill 100% of THIS box -- so they can never drift
     apart from each other, no matter the window's aspect ratio. */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(100vw, 177.78vh, 1280px);  /* 177.78vh = 16:9 width for the viewport height */
    height: min(100vh, 56.25vw, 720px);   /* 56.25vw = 16:9 height for the viewport width */
    transform: translate(-50%, -50%);
  }

  #game,
  #hud,
  #overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #game {
    background: #1a1a1a;
    display: block;
    /* CSS scaling only -- internal resolution stays 1280x720 (set in JS) */
    image-rendering: pixelated;
  }

  /* ---- HUD: plain DOM divs positioned on top of the canvas ---- */
  #hud {
    pointer-events: none; /* clicks pass through to canvas/overlay */
  }

  #hud-timer {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
  }

  #hud-kills {
    position: absolute;
    top: 10px;
    right: 16px;
    font-size: 18px;
    text-shadow: 1px 1px 0 #000;
  }

  #hud-xp-wrap {
    position: absolute;
    top: 4px;
    left: 16px;
    width: 240px;
    height: 14px;
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    overflow: hidden;
  }

  #hud-xp-bar {
    width: 0%;
    height: 100%;
    background: #3dd6ff; /* cyan = XP per GDD */
  }

  #hud-level {
    position: absolute;
    top: 2px;
    left: 264px;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }

  #hud-hp-wrap {
    position: absolute;
    bottom: 16px;
    left: 16px;
    width: 220px;
    height: 22px;
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    overflow: hidden;
  }

  #hud-hp-bar {
    width: 100%;
    height: 100%;
    background: #3ecf5e; /* green when healthy, JS flips to red when low */
  }

  #hud-hp-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }

  /* ---- Overlay: covers the whole game area for title/pause/end screens ---- */
  #overlay {
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  #overlay.hidden {
    display: none;
  }

  #overlay h1 {
    font-size: 42px;
    margin: 0 0 24px 0;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 #000;
  }

  #start-btn {
    font-size: 22px;
    padding: 12px 36px;
    background: #3dd6ff;
    color: #0a0a0c;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  #start-btn:hover {
    background: #6fe3ff;
  }
</style>
</head>
<body>

  <div id="game-wrap">
    <div id="stage">
      <canvas id="game" width="1280" height="720"></canvas>

      <!-- HUD divs: empty for now, game.js will fill them in later prompts -->
      <div id="hud">
        <div id="hud-timer">10:00</div>
        <div id="hud-kills">Kills: 0</div>
        <div id="hud-xp-wrap"><div id="hud-xp-bar"></div></div>
        <div id="hud-level">Lv 1</div>
        <div id="hud-hp-wrap"><div id="hud-hp-bar"></div><div id="hud-hp-text">100/100</div></div>
      </div>

      <!-- Overlay: title screen right now, reused later for pause/win/lose -->
      <div id="overlay">
        <h1>LAST OPERATOR: DEAD ZONE</h1>
        <button id="start-btn">START</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
