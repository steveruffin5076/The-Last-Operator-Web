<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Operator: Dead Zone</title>
<style>
  /* ---- Dark theme, responsive canvas wrapper ---- */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0c;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #e6e6e6;
  }

  /* Wrapper centers the canvas and keeps it scaled to fit the window,
     but the canvas itself always draws at 1280x720 internally. */
  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game {
    background: #1a1a1a;
    display: block;
    /* CSS scaling only -- internal resolution stays 1280x720 (set in JS) */
    width: 100%;
    height: 100%;
    max-width: 1280px;
    max-height: 720px;
    aspect-ratio: 1280 / 720;
    image-rendering: pixelated;
  }

  /* ---- HUD: plain DOM divs positioned on top of the canvas ---- */
  #hud {
    position: absolute;
    top: 0;
    left: 50%;
    width: 1280px;
    height: 720px;
    max-width: 100%;
    aspect-ratio: 1280 / 720;
    transform: translateX(-50%);
    pointer-events: none; /* clicks pass through to canvas/overlay */
  }

  #hud-timer {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
  }

  #hud-kills {
    position: absolute;
    top: 10px;
    right: 16px;
    font-size: 18px;
    text-shadow: 1px 1px 0 #000;
  }

  #hud-xp-wrap {
    position: absolute;
    top: 4px;
    left: 16px;
    width: 240px;
    height: 14px;
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    overflow: hidden;
  }

  #hud-xp-bar {
    width: 0%;
    height: 100%;
    background: #3dd6ff; /* cyan = XP per GDD */
  }

  #hud-hp-wrap {
    position: absolute;
    bottom: 16px;
    left: 16px;
    width: 220px;
    height: 22px;
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    overflow: hidden;
  }

  #hud-hp-bar {
    width: 100%;
    height: 100%;
    background: #e33; /* red/green per GDD, JS will flip color */
  }

  /* ---- Overlay: covers the whole game area for title/pause/end screens ---- */
  #overlay {
    position: absolute;
    top: 0;
    left: 50%;
    width: 1280px;
    height: 720px;
    max-width: 100%;
    aspect-ratio: 1280 / 720;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  #overlay.hidden {
    display: none;
  }

  #overlay h1 {
    font-size: 42px;
    margin: 0 0 24px 0;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 #000;
  }

  #start-btn {
    font-size: 22px;
    padding: 12px 36px;
    background: #3dd6ff;
    color: #0a0a0c;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  #start-btn:hover {
    background: #6fe3ff;
  }
</style>
</head>
<body>

  <div id="game-wrap">
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- HUD divs: empty for now, game.js will fill them in later prompts -->
    <div id="hud">
      <div id="hud-timer">10:00</div>
      <div id="hud-kills">Kills: 0</div>
      <div id="hud-xp-wrap"><div id="hud-xp-bar"></div></div>
      <div id="hud-hp-wrap"><div id="hud-hp-bar"></div></div>
    </div>

    <!-- Overlay: title screen right now, reused later for pause/win/lose -->
    <div id="overlay">
      <h1>LAST OPERATOR: DEAD ZONE</h1>
      <button id="start-btn">START</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
