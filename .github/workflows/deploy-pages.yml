name: Deploy to GitHub Pages

# Static site, no build step -- just publish the repo as-is whenever
# main changes.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a redeploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an in-progress deploy if a newer push comes in.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
